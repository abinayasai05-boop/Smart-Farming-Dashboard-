<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Farming Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <h2>🌱 Smart Farm</h2>
        <ul>
            <li>Dashboard</li>
            <li>Crop Health</li>
            <li>Irrigation</li>
            <li>Weather</li>
            <li>Analytics</li>
        </ul>
    </div>

    <div class="main">

        <div class="header">
            <h1>Smart Farming Dashboard</h1>
            <p>Monitor your farm in real-time</p>
        </div>

        <div class="cards">

            <div class="card">
                <h3>🌦 Weather</h3>
                <div class="weather-icon">☀️</div>
                <p>32°C | Sunny</p>
            </div>

            <div class="card">
                <h3>💧 Soil Moisture</h3>
                <div class="progress">
                    <div class="fill"></div>
                </div>
                <p>78%</p>
            </div>

            <div class="card">
                <h3>🌾 Crop Health</h3>
                <div class="plant"></div>
                <p>Healthy</p>
            </div>

            <div class="card">
                <h3>🚜 Farm Status</h3>
                <div class="pulse"></div>
                <p>All Systems Active</p>
            </div>

        </div>

    </div>

</body>
</html>
